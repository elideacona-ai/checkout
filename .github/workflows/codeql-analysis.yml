# FBREAKING DOWN THE WORKFLOW CODE - LINE BY LINE 😊**
Let's dissect the two workflow codes:
**Code 1: My Workflow (`main.yml`)**
```yml
1. name: My Workflow          # Workflow name
2. on:                        # Trigger event
3.   pull_request:           # Trigger on pull requests
4.     branches:             # Specify branches
5.       - main              # Trigger only on 'main' branch
6. jobs:                     # Define jobs
7.   build:                 # Job name
8.     runs-on: ubuntu-latest # Run on Ubuntu environment
9.     steps:               # Job steps
10.      - name: Checkout code # Step name
11.        uses: actions/checkout@v3 # Use checkout action
```
**Code 2: Checkout Workflow (`main.yml` for actions/checkout)**
```yml
1. name: Checkout            # Workflow name
2. on:                        # Trigger event
3.   pull_request:           # Trigger on pull requests
4.     branches:             # Specify branches
5.       - main              # Trigger only on 'main' branch
6. jobs:                     # Define jobs
7.   checkout:              # Job name
8.     runs-on: ubuntu-latest # Run on Ubuntu environment
9.     steps:               # Job steps
10.      - name: Checkout code # Step name
11.        uses: actions/checkout@v3 # Use checkout action
12.      - name: Verify checkout # Additional step
13.        run: |             # Run shell commands
14.          echo "Checkout successful"
15.          ls -la
```
or most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]
  schedule:
    - cron: '28 9 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]
        # Learn more:
        # https://docs.github.com/en/free-pro-team@latest/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#changing-the-languages-that-are-analyzed

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.1.6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    - run: npm ci
    - run: npm run build
    - run: rm -rf dist # We want code scanning to analyze lib instead (individual .js files)

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
